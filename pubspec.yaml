name: study_app
description: 필기 중심 학습관리 앱 — Solvit
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_math_fork: ^0.7.4
  path_provider: ^2.1.6
  file_picker: ^8.1.2 # 자료요청 글에 PDF 첨부
  open_filex: ^4.5.0 # 받은 PDF 를 PDF 앱으로 열기
  google_mlkit_digital_ink_recognition: ^0.16.1
  web_socket_channel: ^3.0.3
  flutter_svg: ^2.0.10
  webview_flutter: ^4.9.0 # 3D 수업(three.js)을 앱 안에서 재생

# patched copy: Korean glyph fallback inside math + spacing kept at line breaks (third_party/flutter_math_fork/README.md)
dependency_overrides:
  flutter_math_fork:
    path: third_party/flutter_math_fork
  # file_picker 8 는 compileSdk 34 로 만들어졌는데 이 플러그인 최신판은 36 이상을 요구해 빌드가 막힌다 → 34 로도 되는 판으로 고정
  flutter_plugin_android_lifecycle: 2.0.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/problems/
    - assets/lesson3d/solvit3d-runtime.js
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
    # TeX 원문 교재의 본문 글꼴 (Noto Serif CJK KR 의 한글·라틴 부분, OFL)
    - family: NotoSerifKR
      fonts:
        - asset: assets/fonts/NotoSerifKR-Regular.otf
          weight: 400
        - asset: assets/fonts/NotoSerifKR-Bold.otf
          weight: 700
    - family: NanumMyeongjo
      fonts:
        - asset: assets/fonts/NanumMyeongjo-Regular.ttf
          weight: 400
        - asset: assets/fonts/NanumMyeongjo-Bold.ttf
          weight: 700
