name: Emulator smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fonts
        run: bash tools/fetch_fonts.sh
      - name: Generate Android platform folder
        run: |
          flutter create . --project-name study_app --org com.une.pulinote --platforms android --no-pub
          bash tools/patch_android.sh
      - run: flutter pub get
      - name: Stable signing key
        run: mkdir -p ~/.android && cp tools/keys/debug.keystore ~/.android/debug.keystore
      - name: Build x64 release APK (same code/R8 as the tablet build)
        run: flutter build apk --release --target-platform android-x64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/smoke.sh
      - name: Push smoke logs to ci-smoke branch
        if: always()
        run: |
          mkdir -p /tmp/logs && cp -r ci-smoke/* /tmp/logs/ 2>/dev/null || true
          echo "${{ job.status }} ${GITHUB_SHA::7}" > /tmp/logs/status.txt
          cd /tmp/logs && git init -q && git checkout -q -b ci-smoke
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "smoke ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-smoke
