name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Fetch fonts (Pretendard, OFL)
        run: bash tools/fetch_fonts.sh

      - name: Generate Android platform folder
        run: |
          flutter create . --project-name study_app --org com.une.pulinote --platforms android --no-pub
          bash tools/patch_android.sh

      - name: Pub get
        run: flutter pub get

      - name: Resolved package versions
        run: |
          flutter pub deps --style=compact | head -80 || true
          mkdir -p ci-out && cp pubspec.lock ci-out/

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ci-out/analyze.txt

      - name: Unit tests
        run: flutter test 2>&1 | tee ci-out/test.txt; exit ${PIPESTATUS[0]}

      - name: Stable signing key (so updates install over the old app)
        run: mkdir -p ~/.android && cp tools/keys/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Collect APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ci-out/pulinote.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-out
          path: ci-out/
          if-no-files-found: ignore

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ci-out/pulinote.apk \
            --title "최신 빌드 #${{ github.run_number }}" \
            --notes "커밋 ${GITHUB_SHA::7} 기준 자동 빌드입니다. 태블릿에서 pulinote.apk 를 내려받아 설치하세요." \
            --latest
