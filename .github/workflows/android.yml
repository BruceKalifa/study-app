name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: mkdir -p ci-out && flutter --version | tee ci-out/flutter-version.txt

      - name: Validate problem bank
        run: python3 tools/validate_problems.py | tail -15

      - name: Text book converter selftest
        run: python3 tools/text_book.py selftest

      - name: Fetch fonts (Pretendard, OFL)
        run: bash tools/fetch_fonts.sh

      - name: Generate Android platform folder
        run: |
          flutter create . --project-name study_app --org com.une.pulinote --platforms android --no-pub
          bash tools/patch_android.sh

      - name: Pub get
        run: flutter pub get

      - name: Resolved package versions
        run: |
          flutter pub deps --style=compact > ci-out/deps.txt 2>&1 || true
          cp pubspec.lock ci-out/

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ci-out/analyze.txt; exit ${PIPESTATUS[0]}

      - name: Server tests (content, community, ranking, accounts, questions, books)
        run: |
          set -o pipefail
          cd server && npm install --no-audit --no-fund --silent
          node tools/test-content.js 2>&1 | tail -3
          node tools/test-community.js 2>&1 | tail -3
          node tools/test-accounts.js 2>&1 | grep -v '  ✔' | tail -30
          node tools/test-seed.js
          node tools/test-books.js 2>&1 | grep -v '  ✔' | tail -20

      - name: Start server for app integration tests
        run: |
          cd server
          DATA_DIR=$(mktemp -d) CONTENT_DIR=$(mktemp -d) PORT=8099 nohup node server.js > ../ci-out/server.txt 2>&1 &
          sleep 3; curl -sf http://127.0.0.1:8099/api/community/boards | head -c 200

      - name: Unit tests
        run: COMMUNITY_SERVER=127.0.0.1:8099 flutter test 2>&1 | tee ci-out/test.txt; exit ${PIPESTATUS[0]}

      - name: Screenshots (for design review)
        continue-on-error: true
        run: COMMUNITY_SERVER=127.0.0.1:8099 SHOTS=1 flutter test test/screenshots_test.dart > ci-out/shots.txt 2>&1; ls ci-out/shots || true

      - name: Stable signing key (so updates install over the old app)
        run: mkdir -p ~/.android && cp tools/keys/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: flutter build apk --release --no-shrink --target-platform android-arm64 --build-number=${{ github.run_number }} 2>&1 | tee ci-out/build.txt; exit ${PIPESTATUS[0]}

      - name: Collect APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ci-out/pulinote.apk

      # 서명이 늘 같아야 기존 앱 위에 업데이트가 깔린다 (tools/keys/debug.keystore).
      - name: Check the APK signature
        run: |
          set -o pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs ci-out/pulinote.apk | tee ci-out/signer.txt
          GOT=$(grep -oiE 'SHA-256 digest: [0-9a-f]{64}' ci-out/signer.txt | head -1 | awk '{print $NF}')
          WANT=cc5d7cdde334e33f120b36c46d59c22ca90b15e56f6794b39fded0ff4efd1389
          echo "signer: $GOT" | tee -a ci-out/signer.txt
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::APK 서명이 tools/keys/debug.keystore 와 다릅니다 ($GOT). 이대로 올리면 기존 앱 위에 업데이트가 안 됩니다."
            exit 1
          fi

      - name: Push logs to ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/logs && cp ci-out/*.txt ci-out/pubspec.lock /tmp/logs/ 2>/dev/null || true
          cp -r ci-out/shots /tmp/logs/ 2>/dev/null || true
          echo "${{ job.status }} ${GITHUB_SHA::7} run ${{ github.run_number }}" > /tmp/logs/status.txt
          cd /tmp/logs && git init -q && git checkout -q -b ci-logs
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "ci logs ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # version.json: the app compares "build" with its own versionCode and updates itself
          RUN=${{ github.run_number }} MSG="$(git log -1 --pretty=%s)" python3 -c "import json,os; json.dump({'build': int(os.environ['RUN']), 'notes': os.environ['MSG'][:200], 'apk': 'https://github.com/${{ github.repository }}/releases/download/latest/pulinote.apk'}, open('ci-out/version.json', 'w'), ensure_ascii=False)"
          cat ci-out/version.json
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ci-out/pulinote.apk ci-out/version.json \
            --title "최신 빌드 #${{ github.run_number }}" \
            --notes "커밋 ${GITHUB_SHA::7} 기준 자동 빌드입니다. 태블릿에서 pulinote.apk 를 내려받아 설치하세요." \
            --latest
